<title>Little John Network Command</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0A1229; --panel: rgba(20,42,92,.55); --line: #294C95; --ink: #F5F5F7; --muted: #9CA0A6; --gold: #F5B921; --red: #ff4d6d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); background: var(--bg);
  background-image: radial-gradient(900px 500px at 80% -10%, rgba(245,185,33,.10), transparent 60%), linear-gradient(rgba(245,185,33,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(245,185,33,.035) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px; font: 15px/1.45 "Chakra Petch", system-ui, sans-serif; }
form { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; text-align: center; }
.plate { display: inline-block; background: #fff; border-radius: 10px; padding: 8px 12px; box-shadow: 0 0 0 1px rgba(245,185,33,.4), 0 0 28px rgba(245,185,33,.2); }
.plate img { display: block; height: 40px; width: auto; }
h1 { margin: 18px 0 4px; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
input { width: 100%; font: 600 16px "Chakra Petch", sans-serif; color: var(--ink); background: rgba(10,18,41,.8); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px; }
input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
button { margin-top: 12px; width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--gold); color: #0F1530; font: 700 15px "Chakra Petch", sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--red); font-size: 13.5px; min-height: 20px; margin-top: 10px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--gold); text-decoration: none; }
</style>
</head>
